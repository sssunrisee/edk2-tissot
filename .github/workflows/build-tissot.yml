name: Build UEFI for Xiaomi Mi A1 (tissot)

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    name: Build tissot UEFI Image
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            uuid-dev \
            clang \
            llvm \
            iasl \
            nasm \
            gcc-aarch64-linux-gnu \
            g++-aarch64-linux-gnu \
            abootimg \
            python3 \
            python3-pil \
            python3-git \
            gettext \
            device-tree-compiler \
            bison \
            flex \
            libssl-dev

      - name: Initialize nested submodules
        run: |
          git submodule update --init --recursive
          if [ -d "Common/edk2" ]; then
            cd Common/edk2
            git submodule update --init --recursive CryptoPkg/Library/OpensslLib/openssl ArmPkg/Library/ArmSoftFloatLib/berkeley-softfloat-3 BaseTools/Source/C/BrotliCompress/brotli || true
            cd ../..
          fi

      - name: Build UEFI image for tissot
        run: |
          chmod +x build.sh
          set -o pipefail
          ./build.sh --device tissot --toolchain GCC5 --release RELEASE 2>&1 | tee build_output.log

      - name: Publish build log to Summary
        if: always()
        run: |
          if [ -f build_output.log ]; then
            echo "### Build Log (Tail 150 lines)" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            tail -n 150 build_output.log >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: boot-tissot
          path: |
            boot*.img
            *.img
            uefi*.img*
            workspace/Build/**/FV/*UEFI.fd
            Build/**/FV/*UEFI.fd
            tools/BootShim/BootShim.bin
